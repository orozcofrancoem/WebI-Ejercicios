<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 10</title>
</head>


<body>
    <h2>Tabla 3x3</h2>
    <table border="1">
        <tr>
            <th>1,1</th>
            <th>1,2</th>
            <th>1,3</th>
        </tr>
        <tr>
            <td>2,1</td>
            <td>2,2</td>
            <td>2,3</td>
        </tr>
        <tr>
            <td>3,1</td>
            <td>3,2</td>
            <td>3,3</td>
        </tr>
    </table>

    <h2>Tabla 2x4</h2>
    <table border="">
        <tr>
            <td>1,1</td>
            <td>1,2</td>
            <td>1,3</td>
            <td>1,4</td>
        </tr>
        <tr>
            <td>2,1</td>
            <td>2,2</td>
            <td>2,3</td>
            <td>2,4</td>
        </tr>
    </table>

    <h2>Tabla 1+2x3</h2>
    <table border="">
        <tr>
            <td colspan="3">1,1</td>
        </tr>
        <tr>
            <td>2,1</td>
            <td>2,2</td>
            <td>2,3</td>
        </tr>
        <tr>
            <td>3,1</td>
            <td>3,2</td>
            <td>3,3</td>
        </tr>
    </table>

    <!-- ¿CÓMO SERÍA ESTE? -->
    <h2>Tabla random</h2>
    <table border="1">
        <tr>
            <td rowspan="2">A</td>
            <td rowspan="3">C</td>
            <td>D</td>
        </tr>
        <tr>
            <td>E</td>
        </tr>
        <tr>
            <td rowspan="1">B</td>
            <td>F</td>
        </tr>
    </table>

</body>

</html>
