<!DOCTYPE html>
<html lang="en">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ejercicio 1-b</title>
    <style>
        .mayor {
            font-size: 180%;
        }
        .menor {
            font-size: 60%;
        }
    </style>
</head>
<!-- Definir 2 clases de estilo. La clase “mayor” que permita agrandar el tamaño de texto
actual en un 80% y la clase “menor” que permita reducirlo en un 40%.-->
<body>
    <p class="mayor">Texto 1</p>
    <p>Texto 2</p>
    <p class="menor">Texto 3</p>
</body>
</html>
