<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EJERCICIO 1</title>
</head>
<body>
    <!-- Realiza una página que muestre un formulario y verifique la entrada de un número que 
esté comprendido entre 1 y 100. -->
<FORM method="get">
    <label for="entrada">Ingrese un valor de 1 a 100</label>
    <input type="number" id="entrada" name="entrada" min="1" max="100">
    <input type="submit">
</FORM>
</body>
</html>
